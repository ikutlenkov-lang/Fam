<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131d">
<title>Fam Messenger</title>
<script src="/socket.io/socket.io.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, #33416c 0, transparent 35%),
    radial-gradient(circle at 90% 90%, #49316a 0, transparent 35%),
    #10131d;
  color: #f5f6ff;
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
}

.app {
  width: min(1100px, 96%);
  height: min(760px, 94vh);
  margin: 3vh auto;
  display: flex;
  overflow: hidden;
  border: 1px solid #ffffff20;
  border-radius: 24px;
  background: #171b29dd;
  box-shadow: 0 25px 90px #0008;
  backdrop-filter: blur(25px);
}

.sidebar {
  width: 310px;
  min-width: 240px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #ffffff16;
  background: #ffffff05;
}

.brand {
  padding: 24px;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -.8px;
}

.brand span {
  color: #9b8cff;
}

.me {
  margin: 0 16px 15px;
  padding: 13px;
  border-radius: 15px;
  background: #ffffff0b;
  color: #bfc5d9;
  overflow-wrap: anywhere;
}

.section-title {
  padding: 10px 20px;
  color: #858da8;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.users {
  overflow-y: auto;
  flex: 1;
}

.user {
  margin: 4px 10px;
  padding: 13px;
  border-radius: 13px;
  color: #e9eaff;
  background: transparent;
  text-align: left;
  width: calc(100% - 20px);
}

.user:hover, .user.active {
  background: #8d7bff26;
}

.avatar {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  margin-right: 10px;
  border-radius: 13px;
  background: linear-gradient(135deg, #8e7cff, #4fc6dc);
  color: white;
  font-weight: bold;
  vertical-align: middle;
}

.logout {
  margin: 15px;
  padding: 12px;
  border-radius: 12px;
  background: #ff64751c;
  color: #ff9aa6;
}

.chat {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  min-height: 76px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #ffffff16;
  font-weight: bold;
  font-size: 17px;
}

.status {
  display: block;
  margin-top: 5px;
  color: #8e96b0;
  font-size: 12px;
  font-weight: normal;
}

.messages {
  flex: 1;
  padding: 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.empty {
  margin: auto;
  text-align: center;
  color: #8991aa;
  line-height: 1.7;
}

.message {
  max-width: min(75%, 480px);
  padding: 12px 15px;
  border-radius: 17px;
  background: #ffffff12;
  align-self: flex-start;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message.mine {
  align-self: flex-end;
  background: linear-gradient(135deg, #7668e9, #6555c9);
}

.message small {
  display: block;
  margin-top: 7px;
  opacity: .65;
  font-size: 10px;
  text-align: right;
}

.attachment {
  display: block;
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  background: #0002;
  color: white;
  text-decoration: underline;
  cursor: pointer;
}

.composer {
  padding: 15px;
  display: flex;
  gap: 9px;
  border-top: 1px solid #ffffff16;
  align-items: center;
}

.composer input {
  min-width: 0;
  flex: 1;
  padding: 14px 16px;
  border: 1px solid #ffffff18;
  border-radius: 14px;
  outline: none;
  background: #ffffff0b;
  color: white;
}

.composer input:focus {
  border-color: #9485ff;
}

.send, .attach {
  height: 46px;
  min-width: 46px;
  border-radius: 14px;
  background: #8172ef;
  color: white;
  font-size: 19px;
}

.attach {
  background: #ffffff15;
}

.auth-screen {
  width: min(420px, 92%);
  margin: 10vh auto;
  padding: 30px;
  border: 1px solid #ffffff20;
  border-radius: 24px;
  background: #171b29eF;
  box-shadow: 0 25px 90px #0008;
}

.auth-screen h1 {
  margin-top: 0;
}

.auth-screen p {
  color: #9da5bf;
}

.auth-screen input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ffffff20;
  border-radius: 12px;
  outline: none;
  background: #ffffff0b;
  color: white;
}

.auth-buttons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.auth-buttons button {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  background: #8172ef;
  color: white;
}

.auth-buttons button:last-child {
  background: #ffffff18;
}

.notice {
  min-height: 20px;
  margin-top: 12px;
  color: #ff9aa6;
  font-size: 13px;
}

.hidden {
  display: none !important;
}

@media(max-width: 650px) {
  .app {
    width: 100%;
    height: 100dvh;
    margin: 0;
    border-radius: 0;
  }

  .sidebar {
    width: 115px;
    min-width: 115px;
  }

  .brand {
    padding: 17px 10px;
    font-size: 17px;
  }

  .me {
    margin: 0 6px 10px;
    padding: 8px;
    font-size: 11px;
  }

  .section-title {
    padding: 8px;
    font-size: 10px;
  }

  .user {
    margin: 3px 4px;
    width: calc(100% - 8px);
    padding: 10px 5px;
    font-size: 11px;
    overflow-wrap: anywhere;
  }

  .user .avatar {
    display: grid;
    margin: 0 auto 6px;
  }

  .logout {
    margin: 6px;
    padding: 9px 4px;
    font-size: 11px;
  }

  .chat-header {
    padding: 14px;
  }

  .messages {
    padding: 12px;
  }

  .message {
    max-width: 88%;
  }

  .composer {
    padding: 9px;
    gap: 6px;
  }

  .composer input {
    padding: 12px 9px;
    font-size: 13px;
  }

  .send, .attach {
    min-width: 40px;
    height: 42px;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="auth-screen">
  <h1>Fam <span style="color:#9b8cff">Messenger</span></h1>
  <p>Твой мир. Твои люди.</p>

  <input id="username" placeholder="Логин" maxlength="30"
         autocomplete="username">

  <input id="password" type="password" placeholder="Пароль"
         autocomplete="current-password">

  <div class="auth-buttons">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Создать аккаунт</button>
  </div>

  <div id="authNotice" class="notice"></div>
</div>

<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="brand">Fam <span>Messenger</span></div>

    <div class="me">
      Вы вошли как:<br>
      <b id="myName">...</b>
    </div>

    <div class="section-title">Контакты</div>
    <div id="users" class="users"></div>

    <button class="logout" onclick="logout()">Выйти</button>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div>
        <div id="chatName">Выберите собеседника</div>
        <span id="chatStatus" class="status">Fam Messenger</span>
      </div>
    </header>

    <div id="messages" class="messages">
      <div class="empty">
        <div style="font-size:42px">✦</div>
        Выберите контакт слева,<br>
        чтобы начать переписку.
      </div>
    </div>

    <form class="composer" onsubmit="sendText(event)">
      <button type="button" class="attach"
              onclick="document.getElementById('fileInput').click()">
        +
      </button>

      <input id="messageInput"
             placeholder="Написать сообщение..."
             maxlength="5000"
             autocomplete="off">

      <button class="send" type="submit">➤</button>

      <input id="fileInput" type="file" hidden
             accept="image/jpeg,image/png,image/gif,image/webp,image/heic,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx"
             onchange="uploadFile(event)">
    </form>
  </main>
</div>

<script>
const API = "";
let token = localStorage.getItem("fam_token");
let me = null;
let activeUser = null;
let socket = null;
let loadedMessageIds = new Set();

const $ = id => document.getElementById(id);

async function api(url, options = {}) {
  const headers = {
    ...(options.headers || {}),
    Authorization: "Bearer " + token
  };

  if (options.body && !(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(API + url, {
    ...options,
    headers
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Ошибка запроса");
  }

  return data;
}

function showNotice(message) {
  $("authNotice").textContent = message;
}

async function login() {
  try {
    const username = $("username").value.trim();
    const password = $("password").value;

    const data = await fetch(API + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    }).then(r => r.json());

    if (!data.token) throw new Error(data.error || "Не удалось войти");

    token = data.token;
    localStorage.setItem("fam_token", token);
    await startApp();
  } catch (error) {
    showNotice(error.message);
  }
}

async function register() {
  try {
    const username = $("username").value.trim();
    const password = $("password").value;

    const data = await fetch(API + "/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    }).then(r => r.json());

    if (!data.token) throw new Error(data.error || "Не удалось создать аккаунт");

    token = data.token;
    localStorage.setItem("fam_token", token);
    await startApp();
  } catch (error) {
    showNotice(error.message);
  }
}

async function startApp() {
  try {
    me = await api("/api/me");

    $("authScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("myName").textContent = me.username;

    connectSocket();
    await loadUsers();
  } catch (error) {
    logout();
    showNotice(error.message);
  }
}

function connectSocket() {
  if (socket) socket.disconnect();

  socket = io({
    auth: { token }
  });

  socket.on("connect", () => {
    $("chatStatus").textContent = "Подключено";
  });

  socket.on("disconnect", () => {
    $("chatStatus").textContent = "Переподключение...";
  });

  socket.on("connect_error", () => {
    $("chatStatus").textContent = "Нет соединения";
  });

  socket.on("new_message", message => {
    if (
      activeUser &&
      (
        Number(message.sender_id) === Number(activeUser.id) ||
        Number(message.receiver_id) === Number(activeUser.id)
      )
    ) {
      addMessage(message);
    }

    loadUsers();
  });
}

async function loadUsers() {
  try {
    const users = await api("/api/users");
    const container = $("users");
    container.innerHTML = "";

    if (!users.length) {
      container.textContent = "Пока нет контактов";
      return;
    }

    users.forEach(user => {
      const button = document.createElement("button");
      button.className = "user" +
        (activeUser && Number(activeUser.id) === Number(user.id)
          ? " active" : "");

      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = user.username[0].toUpperCase();

      const name = document.createElement("span");
      name.textContent = user.username;

      button.append(avatar, name);
      button.onclick = () => openChat(user);
      container.appendChild(button);
    });
  } catch (error) {
    console.error(error);
  }
}

async function openChat(user) {
  activeUser = user;
  loadedMessageIds.clear();

  $("chatName").textContent = user.username;
  $("chatStatus").textContent = "Переписка";
  $("messages").innerHTML = "";

  await loadUsers();

  try {
    const messages = await api("/api/messages/" + user.id);
    messages.forEach(addMessage);
    scrollBottom();
  } catch (error) {
    alert(error.message);
  }
}

function addMessage(message) {
  if (loadedMessageIds.has(String(message.id))) return;
  loadedMessageIds.add(String(message.id));

  const box = document.createElement("div");
  box.className = "message" +
    (Number(message.sender_id) === Number(me.id) ? " mine" : "");

  if (message.content) {
    const text = document.createElement("div");
    text.textContent = message.content;
    box.appendChild(text);
  }

  if (message.attachment_id) {
    const link = document.createElement("a");
    link.className = "attachment";
    link.textContent = "📎 " + (message.original_name || "Вложение");
    link.href = "#";
    link.onclick = async event => {
      event.preventDefault();
      await downloadFile(message.attachment_id, message.original_name);
    };
    box.appendChild(link);
  }

  const time = document.createElement("small");
  time.textContent = new Date(message.created_at).toLocaleString("ru-RU");
  box.appendChild(time);

  $("messages").appendChild(box);
  scrollBottom();
}

function scrollBottom() {
  $("messages").scrollTop = $("messages").scrollHeight;
}

function sendText(event) {
  event.preventDefault();

  const input = $("messageInput");
  const content = input.value.trim();

  if (!activeUser) {
    alert("Сначала выбери собеседника");
    return;
  }

  if (!content) return;

  if (!socket || !socket.connected) {
    alert("Нет соединения с сервером");
    return;
  }

  socket.emit("send_message", {
    receiverId: activeUser.id,
    content
  }, result => {
    if (!result || !result.ok) {
      alert(result?.error || "Не удалось отправить сообщение");
      return;
    }

    input.value = "";
  });
}

async function uploadFile(event) {
  const file = event.target.files[0];
  event.target.value = "";

  if (!file) return;

  if (!activeUser) {
    alert("Сначала выбери собеседника");
    return;
  }

  const form = new FormData();
  form.append("file", file);
  form.append("receiverId", activeUser.id);

  try {
    $("chatStatus").textContent = "Загрузка файла...";

    const uploaded = await api("/api/upload", {
      method: "POST",
      body: form
    });

    socket.emit("send_message", {
      receiverId: activeUser.id,
      content: "",
      attachmentId: uploaded.id
    }, result => {
      if (!result || !result.ok) {
        alert(result?.error || "Файл загружен, но сообщение не отправлено");
      }

      $("chatStatus").textContent = "Переписка";
    });

  } catch (error) {
    alert(error.message);
    $("chatStatus").textContent = "Переписка";
  }
}

async function downloadFile(id, filename) {
  try {
    const response = await fetch(API + "/api/files/" + id, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!response.ok) throw new Error("Не удалось скачать файл");

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = filename || "file";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (error) {
    alert(error.message);
  }
}

function logout() {
  if (socket) socket.disconnect();

  localStorage.removeItem("fam_token");
  token = null;
  me = null;
  activeUser = null;

  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

if (token) {
  startApp();
}
</script>

</body>
</html>
