
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10111b">
<title>Fam Messenger</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0d0f19;color:white;
 font-family:Arial,sans-serif;min-height:100vh;
 background-image:
 radial-gradient(at 10% 10%,#37316b 0,transparent 40%),
 radial-gradient(at 90% 90%,#153c55 0,transparent 40%);
}
button,input{font:inherit}
button{cursor:pointer}
.app{
 display:flex;max-width:1250px;height:92vh;
 margin:4vh auto;background:#ffffff0c;
 border:1px solid #ffffff20;border-radius:24px;
 backdrop-filter:blur(30px);overflow:hidden;
 box-shadow:0 20px 100px #0008;
}
.sidebar{width:340px;padding:24px;border-right:1px solid #ffffff18}
.logo{font-size:27px;font-weight:800;letter-spacing:-1px}
.logo span{color:#a99aff}
.subtitle{color:#999;margin:7px 0 25px;font-size:12px}
.search,input{
 background:#ffffff10;border:1px solid #ffffff20;
 color:white;border-radius:12px;padding:13px;outline:none;
 width:100%;
}
.user-list{margin-top:20px}
.user{
 padding:14px;border-radius:15px;cursor:pointer;
 display:flex;align-items:center;gap:12px;
 transition:.2s;margin-bottom:5px;
}
.user:hover,.user.active{background:#ffffff18}
.avatar{
 width:43px;height:43px;border-radius:15px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#8d72ff,#42c9d5);
 font-weight:bold;
}
.user-info{flex:1;min-width:0}
.user-info b{display:block}
.user-info small{color:#aaa}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
 height:82px;padding:20px 25px;
 border-bottom:1px solid #ffffff18;
 display:flex;align-items:center;gap:12px;
}
.topbar small{color:#8ce8bc}
.messages{
 flex:1;overflow:auto;padding:25px;
 display:flex;flex-direction:column;gap:13px;
}
.empty{
 margin:auto;text-align:center;color:#aaa;
}
.bubble{
 padding:13px 17px;border-radius:18px;
 max-width:75%;background:#ffffff13;
 line-height:1.5;overflow-wrap:anywhere;
}
.mine{
 align-self:flex-end;
 background:linear-gradient(135deg,#7258d9,#496acb);
}
.composer{
 padding:18px 22px;border-top:1px solid #ffffff18;
 display:flex;gap:10px;
}
.composer input{flex:1}
.send{
 border:0;border-radius:13px;padding:0 23px;
 color:white;background:linear-gradient(135deg,#8668ef,#4d85e7);
}
.modal{
 position:fixed;inset:0;background:#000b;
 display:grid;place-items:center;padding:20px;
}
.panel{
 width:min(400px,100%);padding:30px;
 border:1px solid #ffffff30;border-radius:24px;
 background:#202033f2;backdrop-filter:blur(25px);
}
.panel h2{margin-top:0}
.panel input{margin:7px 0}
.primary{
 width:100%;padding:14px;border:0;border-radius:12px;
 background:linear-gradient(135deg,#8668ef,#4d85e7);
 color:white;margin-top:12px;font-weight:bold;
}
.switch{color:#b8aaff;cursor:pointer;text-align:center;margin-top:18px}
.error{color:#ff9090;font-size:13px}
@media(max-width:650px){
 .app{height:100vh;margin:0;border-radius:0}
 .sidebar{width:105px;padding:12px}
 .logo{font-size:16px}
 .subtitle,.search,.user-info,.sidebar h4{display:none}
 .user{justify-content:center;padding:10px}
 .avatar{flex-shrink:0}
 .topbar{height:70px}
 .messages{padding:15px}
}
</style>
</head>
<body>

<div class="app">
 <aside class="sidebar">
  <div class="logo">FAM<span>.</span></div>
  <div class="subtitle">YOUR WORLD. YOUR PEOPLE.</div>
  <input class="search" id="search" placeholder="Поиск пользователей">
  <h4>ПОЛЬЗОВАТЕЛИ</h4>
  <div class="user-list" id="users">
   <div class="empty">Загрузка...</div>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <div class="avatar">F</div>
   <div>
    <b id="chatName">Fam Messenger</b><br>
    <small id="status">Твой мир общения</small>
   </div>
  </header>

  <section class="messages" id="messages">
   <div class="empty">
    <h2>Добро пожаловать в FAM.</h2>
    Выбери пользователя, чтобы начать общение.
   </div>
  </section>

  <form class="composer" id="composer">
   <input id="messageInput" placeholder="Напиши сообщение..." autocomplete="off">
   <button class="send">➤</button>
  </form>
 </main>
</div>

<div class="modal" id="authModal">
 <div class="panel">
  <div class="logo">FAM<span>.</span></div>
  <p class="subtitle">YOUR WORLD. YOUR PEOPLE.</p>
  <h2 id="authTitle">Вход в аккаунт</h2>
  <input id="username" placeholder="Имя пользователя">
  <input id="password" type="password" placeholder="Пароль (минимум 10 символов)">
  <button class="primary" id="authButton">Войти</button>
  <div class="error" id="error"></div>
  <div class="switch" id="switch">Нет аккаунта? Зарегистрироваться</div>
 </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("fam_token");
let currentUser = null;
let selectedUser = null;
let socket = null;
let registration = false;
let knownMessages = new Set();

async function api(url, options={}) {
 const response = await fetch(url,{
  ...options,
  headers:{
   "Content-Type":"application/json",
   ...(token?{Authorization:"Bearer "+token}:{}),
   ...(options.headers||{})
  }
 });
 const data = await response.json();
 if(!response.ok) throw new Error(data.error || "Ошибка");
 return data;
}

$("switch").onclick=()=>{
 registration=!registration;
 $("authTitle").textContent=registration?"Создание аккаунта":"Вход в аккаунт";
 $("authButton").textContent=registration?"Зарегистрироваться":"Войти";
 $("switch").textContent=registration?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться";
 $("error").textContent="";
};

$("authButton").onclick=async()=>{
 try{
  $("error").textContent="";

  const username=$("username").value.trim();
  const password=$("password").value;

  if(registration){
   await api("/api/register",{
    method:"POST",
    body:JSON.stringify({username,password})
   });
  }

  const data=await api("/api/login",{
   method:"POST",
   body:JSON.stringify({username,password})
  });

  token=data.token;
  currentUser=data.user;
  localStorage.setItem("fam_token",token);
  $("authModal").style.display="none";
  connect();
 }catch(e){
  $("error").textContent=e.message;
 }
};

function addMessage(message){
 if(knownMessages.has(message.id))return;
 knownMessages.add(message.id);

 const div=document.createElement("div");
 div.className="bubble "+(
  message.sender_id===currentUser.id?"mine":""
 );
 div.textContent=message.content;
 $("messages").appendChild(div);
 $("messages").scrollTop=$("messages").scrollHeight;
}

async function loadUsers(){
 const users=await api("/api/users");
 $("users").replaceChildren();

 users.forEach(user=>{
  const div=document.createElement("div");
  div.className="user";
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=user.username[0].toUpperCase();

  const info=document.createElement("div");
  info.className="user-info";
  const name=document.createElement("b");
  name.textContent=user.username;
  const label=document.createElement("small");
  label.textContent="Fam Messenger";
  info.append(name,label);

  div.append(avatar,info);
  div.onclick=()=>selectUser(user,div);
  $("users").appendChild(div);
 });
}

function connect(){
 socket=io({auth:{token}});

 socket.on("connect_error",()=>{
  $("status").textContent="Ошибка подключения";
 });

 socket.on("connect",()=>{
  $("status").textContent="Онлайн";
 });

 socket.on("new_message",message=>{
  if(selectedUser && (
   message.sender_id===selectedUser.id ||
   message.receiver_id===selectedUser.id
  )){
   addMessage(message);
  }
 });

 loadUsers().catch(e=>{
  $("status").textContent=e.message;
 });
}

async function selectUser(user,element){
 selectedUser=user;
 knownMessages.clear();
 $("chatName").textContent=user.username;
 $("messages").replaceChildren();

 document.querySelectorAll(".user").forEach(x=>x.classList.remove("active"));
 element.classList.add("active");

 const empty=document.createElement("div");
 empty.className="empty";
 empty.textContent="История переписки пока не загружена.";
 $("messages").appendChild(empty);
}

$("composer").onsubmit=async e=>{
 e.preventDefault();

 if(!selectedUser || !socket){
  return alert("Сначала выбери пользователя");
 }

 const content=$("messageInput").value.trim();
 if(!content)return;

 socket.emit("send_message",{
  receiverId:selectedUser.id,
  content
 },result=>{
  if(result?.error){
   alert(result.error);
  }else{
   $("messageInput").value="";
  }
 });
};

$("search").oninput=()=>{
 const value=$("search").value.toLowerCase();
 document.querySelectorAll(".user").forEach(user=>{
  user.style.display=user.textContent.toLowerCase().includes(value)?"flex":"none";
 });
};

async function start(){
 if(!token){
  $("authModal").style.display="grid";
  return;
 }

 try{
  const users=await api("/api/users");
  currentUser=await api("/api/login",{
   method:"POST",
   body:JSON.stringify({
    username:"",
    password:""
   })
  });
 }catch{
  localStorage.removeItem("fam_token");
  token=null;
  $("authModal").style.display="grid";
 }
}

start();
</script>
</body>
</html>
